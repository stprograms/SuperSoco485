name: Run PlatformIO Unit Tests

on:
  push:
    branches-ignore:
      - main

    paths:
      - .github/workflows/run-unit-tests.yml

  pull_request:
    branches:
      - main
    paths:
      - src
      - test
      - include

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Create environment
        run: |
          python -m venv .venv

      - uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-venv

      - name: Install platformio
        run: |
          source .venv/bin/activate
          python -m pip install pip --upgrade

          pip install platformio --upgrade

      - name: Run unit tests
        run: |
          source .venv/bin/activate
          platformio test --environment native
